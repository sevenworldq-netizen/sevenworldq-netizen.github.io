<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pip Logic Academy — Coming Soon</title>
<meta property="og:title" content="Pip Logic Academy — Coming Soon">
<meta property="og:description" content="The app goes live soon. Tap to reveal.">
<meta property="og:type" content="website">
<style>
:root{--bg:#05060f;--fg:#fff;--gold:#ffd166;--cy:#3ddcff;--mg:#ff4fd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic",sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hint{position:fixed;left:0;right:0;text-align:center;pointer-events:none;transition:opacity .4s}
#hint .f{font-size:44px;animation:tap 1.2s ease-in-out infinite}
#hint .am{font-size:26px;font-weight:800;margin-top:6px;background:linear-gradient(90deg,var(--cy),var(--gold),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;animation:glow 1.6s ease-in-out infinite}
#hint .en{font-size:12px;letter-spacing:.35em;opacity:.55;margin-top:6px}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(.92)}}
@keyframes glow{0%,100%{opacity:.7}50%{opacity:1}}
#msg{position:fixed;left:0;right:0;text-align:center;padding:0 22px;pointer-events:none}
#msg>*{opacity:0;transform:translateY(24px) scale(.96);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.9,.3,1.2)}
#msg.show>*{opacity:1;transform:none}
#msg.show>*:nth-child(2){transition-delay:.25s}
#msg.show>*:nth-child(3){transition-delay:.5s}
#msg.show>*:nth-child(4){transition-delay:.8s}
.badge{display:inline-block;font-size:12px;letter-spacing:.3em;padding:8px 16px;border:1px solid rgba(255,255,255,.25);border-radius:99px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
h1{margin:16px 0 8px;font-size:clamp(28px,8.5vw,46px);line-height:1.1;font-weight:900;background:linear-gradient(90deg,var(--cy),var(--gold),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 auto;max-width:420px;font-size:clamp(16px,4.6vw,20px);line-height:1.5;opacity:.88}
.cong{margin-top:18px;font-size:clamp(22px,6.5vw,30px);font-weight:800;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.55)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><div class="f">👆</div><div class="am">በእጅ ይጫኑት</div><div class="en">TAP HERE</div></div>
<div id="msg">
  <div class="badge">PIP LOGIC ACADEMY</div>
  <h1>The App Goes Live Soon</h1>
  <p>Our app launches in just a few hours.</p>
  <div class="cong">Congratulations! 🎉</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),hint=document.getElementById('hint'),msg=document.getElementById('msg');
let w,h,dpr,cx,cy,R,sc,phase='orb',tP=0,burstT=0,formT=0,shown=false,nextBoom=0;
const N=innerWidth<600?1100:1800;
const HUES=[45,190,320,265,150];
const P=[],S=[],W=[];
for(let i=0;i<N;i++){
  const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),th=i*2.399963;
  P.push({ox:Math.cos(th)*r,oy:y,oz:Math.sin(th)*r,x:0,y:0,vx:0,vy:0,h:HUES[i%HUES.length]+Math.random()*30,tx:0,ty:0,has:false,dl:0,z:1});
}
function build(){
  const o=document.createElement('canvas');o.width=w;o.height=h;const c=o.getContext('2d');
  const font=s=>`900 ${s}px system-ui,-apple-system,"Segoe UI",Arial,sans-serif`;
  c.font=font(100);
  let fs=100*0.84*w/c.measureText('COMING').width;
  fs=Math.min(fs,h*0.14,170);
  c.font=font(fs);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
  const top=h*0.09;
  c.fillText('COMING',w/2,top+fs*0.5);
  c.fillText('SOON',w/2,top+fs*1.45);
  const step=Math.max(3,Math.ceil(fs/24)),d=c.getImageData(0,0,w,h).data,pts=[];
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step)if(d[(y*w+x)*4+3]>128)pts.push([x,y]);
  for(let i=pts.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
  P.forEach((p,i)=>{const t=pts[i];if(t){p.has=true;p.tx=t[0];p.ty=t[1]}else p.has=false});
  msg.style.top=(top+fs*2.1)+'px';
}
function resize(){
  dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
  cv.width=w*dpr;cv.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=w/2;cy=h*0.44;R=Math.min(w,h)*0.22;sc=Math.min(w,h)/420;
  hint.style.top=(cy+R*1.3)+'px';
  build();
}
addEventListener('resize',resize);resize();
function boom(x,y,n,hue){
  if(S.length>1800)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283,s=(0.6+Math.pow(Math.random(),.6)*5.5)*sc;
    S.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0,m:55+Math.random()*60,h:hue+Math.random()*50});
  }
  W.push({x,y,r:4,a:.9});
}
function startBurst(t){
  phase='burst';burstT=t;
  P.forEach(p=>{
    const a=Math.atan2(p.y-cy,p.x-cx)+(Math.random()-.5)*.6,s=(2+Math.pow(Math.random(),1.4)*16)*sc;
    p.vx=Math.cos(a)*s;p.vy=Math.sin(a)*s;p.dl=Math.random()*700;
  });
  W.push({x:cx,y:cy,r:10,a:1},{x:cx,y:cy,r:2,a:.8});
  hint.style.opacity=0;
  try{navigator.vibrate&&navigator.vibrate([40,30,80])}catch(e){}
}
addEventListener('pointerdown',e=>{
  const t=performance.now();
  if(phase==='orb'){phase='charge';tP=t;try{navigator.vibrate&&navigator.vibrate(20)}catch(_){}}
  else if(phase==='done'||phase==='form'){boom(e.clientX,e.clientY,110,HUES[Math.random()*5|0]);try{navigator.vibrate&&navigator.vibrate(15)}catch(_){}}
});
function frame(t){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=phase==='orb'||phase==='charge'?'rgba(5,6,15,.45)':'rgba(5,6,15,.2)';
  ctx.fillRect(0,0,w,h);
  if(phase==='burst'&&t-burstT<260){ctx.fillStyle=`rgba(255,255,255,${.55*(1-(t-burstT)/260)})`;ctx.fillRect(0,0,w,h)}
  ctx.globalCompositeOperation='lighter';
  if(phase==='orb'||phase==='charge'){
    let r=R*(1+.04*Math.sin(t*.003)),bright=0;
    if(phase==='charge'){
      const k=Math.min(1,(t-tP)/260);r=R*(1-.5*k*k)+Math.sin(t*.12)*3;bright=k;
      if(k>=1)startBurst(t);
    }
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.8);
    g.addColorStop(0,`rgba(120,200,255,${.28+bright*.5})`);g.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle=g;ctx.fillRect(cx-r*2,cy-r*2,r*4,r*4);
    const a=t*(.0006+bright*.01),ca=Math.cos(a),sa=Math.sin(a);
    for(const p of P){
      const x=p.ox*ca+p.oz*sa,z=-p.ox*sa+p.oz*ca;
      p.x=cx+x*r;p.y=cy+p.oy*r;
      const d=(z+1)/2;
      ctx.globalAlpha=.3+.7*d;
      ctx.fillStyle=`hsl(${p.h+t*.03},100%,${60+bright*30}%)`;
      const s=1.4+d*1.8;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
  }else{
    const ft=t-formT;
    for(let i=0;i<N;i++){
      const p=P[i];
      if(phase==='burst'){p.vx*=.955;p.vy*=.955;p.vy+=.04*sc}
      else if(p.has&&ft>p.dl){p.vx=(p.vx+(p.tx-p.x)*.022)*.86;p.vy=(p.vy+(p.ty-p.y)*.022)*.86}
      else{p.vx*=.99;p.vy=p.vy*.99-.004}
      p.x+=p.vx;p.y+=p.vy;
      if(!p.has){if(p.y<-10)p.y=h+10;if(p.x<-10)p.x=w+10;if(p.x>w+10)p.x=-10}
      let col,al,s=2.3;
      if(phase!=='burst'&&p.has){
        const j=Math.sin(t*.004+i)*.5;p.x+=j*.15;
        col=`hsl(${(p.h+t*.06+p.tx*.25)%360},100%,68%)`;al=.95;
      }else{col=`hsl(${p.h},100%,65%)`;al=phase==='burst'?.9:.25+.4*Math.abs(Math.sin(t*.003+i));s=p.has?2.3:1.6}
      ctx.globalAlpha=al;ctx.fillStyle=col;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
    if(phase==='burst'&&t-burstT>1100){phase='form';formT=t}
    if(phase==='form'&&!shown&&t-formT>1600){shown=true;msg.classList.add('show');phase='done';nextBoom=t+300;try{navigator.vibrate&&navigator.vibrate([30,40,30,40,120])}catch(e){}}
    if(phase==='done'&&t>nextBoom){boom(w*(.1+Math.random()*.8),h*(.3+Math.random()*.5),70,HUES[Math.random()*5|0]);nextBoom=t+450+Math.random()*700}
  }
  for(let i=S.length-1;i>=0;i--){
    const s=S[i];s.vx*=.985;s.vy=s.vy*.985+.05*sc;s.x+=s.vx;s.y+=s.vy;s.l++;
    if(s.l>s.m){S.splice(i,1);continue}
    ctx.globalAlpha=1-s.l/s.m;ctx.fillStyle=`hsl(${s.h},100%,65%)`;ctx.fillRect(s.x-1.2,s.y-1.2,2.4,2.4);
  }
  ctx.globalAlpha=1;ctx.lineWidth=3;
  for(let i=W.length-1;i>=0;i--){
    const k=W[i];k.r+=14*sc;k.a*=.94;
    if(k.a<.02){W.splice(i,1);continue}
    ctx.strokeStyle=`rgba(160,220,255,${k.a})`;ctx.beginPath();ctx.arc(k.x,k.y,k.r,0,6.283);ctx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
